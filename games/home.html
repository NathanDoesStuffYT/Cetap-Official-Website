<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Games</title>
    <style>
        
        .game-card {
    background: #2a2a2a;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
    cursor: pointer;
    border: 1px solid #333;
    display: flex;
    flex-direction: column; /* Stacks thumb on top of text */
}

.thumb-container {
    width: 100%;
    aspect-ratio: 16 / 9; /* Forces the 16:9 shape */
    overflow: hidden;
    background: #444; /* Placeholder color */
}

.thumb-container img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Crops image to fit the 16:9 box */
}

.info {
    padding: 15px;
    background: #2a2a2a;
    border-top: 1px solid #444;
}

.info h3 { margin: 0; font-size: 1.1rem; color: #fff; }
.info p { margin: 5px 0 0; font-size: 0.85rem; color: #aaa; }
        
        body {
            font-family: sans-serif;
            background: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff0055;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .grid {
    display: grid;
    /* This creates as many 280px columns as will fit, then fills the rest of the space */
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
    gap: 25px; /* Space between the cards */
    padding: 20px 0;
    }

    /* Optional: Make the container a bit wider for the grid */
body {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px;
}
        .game-card {
            background: #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
            border: 1px solid #333;
        }
        .game-card:hover {
            transform: scale(1.05);
            border-color: #ff0055;
        }
        .thumbnail {
            width: 100%;
            height: 150px;
            background: #444; /* Placeholder color */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .info { padding: 15px; }
        .info h3 { margin: 0; font-size: 1.2rem; }
        .logout { color: #aaa; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <h1>My Game Collection - GAMES CODED BY AI</h1>
    <a href="/" class="logout">Logout</a>
</header>

<div class="grid">
    <div class="game-card" onclick="location.href='play-game1.html'">
        <div class="thumb-container">
            <img src="img/thumbnail-gun.png" alt="Shooter">
        </div>
        <div class="info">
            <h3>Shooter Game</h3>
            <p>Action • Waves</p>
        </div>
    </div>

    <div class="game-card" onclick="location.href='play-game2.html'">
        <div class="thumb-container">
            <img src="img/Screenshot from 2026-04-24 08-04-30.png" alt="thumbnail of pong">
        </div>
        <div class="info">
            <h3>Ping Pong</h3>
            <p>Sports • Action</p>
        </div>
    </div>

    <div class="game-card" onclick="location.href='play-game3.html'">
        <div class="thumb-container">
            <img src="img/Screenshot from 2026-04-24 10-20-10.png" alt="A Block-Craft Thumbnail">
        </div>
        <div class="info">
            <h3>2D Block-Craft</h3>
            <p>Action • Story</p>
        </div>
    </div>
</div>

</body>
</html>
